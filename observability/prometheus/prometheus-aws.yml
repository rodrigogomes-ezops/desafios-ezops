global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend-aws'
    metrics_path: /metrics
    static_configs:
      - targets: ['${ALB_DNS_NAME}:80']
        labels:
          service: 'backend'
          environment: 'aws'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

