global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend API - via ALB (porta 80, não 3000)
  - job_name: 'backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rodrigo-alb-backend-1568030242.us-east-2.elb.amazonaws.com:80']
        labels:
          environment: 'production'
          service: 'backend-financeiro'
    # Timeout para evitar falhas em conexões lentas
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']