name: Infraestrutura (Terraform)

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**' # Só roda se mexer na pasta terraform
      - 'observability/**' # Também roda se mexer na pasta observability
      - 'Dockerfile.prometheus'
      - 'Dockerfile.grafana'

jobs:
  build-observability:
    name: Build & Push Observability Images
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip-observability]') == false

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Prometheus Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PROMETHEUS: ${{ secrets.ECR_REPOSITORY_PROMETHEUS || 'prometheus' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.prometheus -t $ECR_REGISTRY/$ECR_REPOSITORY_PROMETHEUS:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PROMETHEUS:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_PROMETHEUS:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PROMETHEUS:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PROMETHEUS:latest
          echo "PROMETHEUS_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY_PROMETHEUS:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build & Push Grafana Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_GRAFANA: ${{ secrets.ECR_REPOSITORY_GRAFANA || 'grafana' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.grafana -t $ECR_REGISTRY/$ECR_REPOSITORY_GRAFANA:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_GRAFANA:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_GRAFANA:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_GRAFANA:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_GRAFANA:latest
          echo "GRAFANA_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY_GRAFANA:$IMAGE_TAG" >> $GITHUB_ENV

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-observability
    if: always() && (needs.build-observability.result == 'success' || needs.build-observability.result == 'skipped')
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login no Amazon ECR (para obter URLs das imagens)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Obter URLs das Imagens de Observabilidade
        id: images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PROMETHEUS: ${{ secrets.ECR_REPOSITORY_PROMETHEUS || 'prometheus' }}
          ECR_REPOSITORY_GRAFANA: ${{ secrets.ECR_REPOSITORY_GRAFANA || 'grafana' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "prometheus_image=$ECR_REGISTRY/$ECR_REPOSITORY_PROMETHEUS:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "grafana_image=$ECR_REGISTRY/$ECR_REPOSITORY_GRAFANA:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          # A senha do banco continua vindo dos Secrets por segurança
          TF_VAR_password_postgre: ${{ secrets.DB_PASSWORD }}
          TF_VAR_prometheus_image: ${{ steps.images.outputs.prometheus_image }}
          TF_VAR_grafana_image: ${{ steps.images.outputs.grafana_image }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD || 'admin123' }}