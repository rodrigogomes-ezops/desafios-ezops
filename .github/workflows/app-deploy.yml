name: Deploy App (Backend & Frontend)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'terraform/**' # Não roda se só mexeu na infra (opcional)
  # Permite que o pipeline de Infra chame este aqui assim que terminar
  workflow_run:
    workflows: ["Infraestrutura (Terraform)"]
    types:
      - completed

jobs:
  deploy:
    name: Build & Deploy Fullstack
    runs-on: ubuntu-latest
    # Garante que só roda se a infra tiver passado (no caso de workflow_run)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # -----------------------------------------------------------
      # O TRUQUE: Ler os Outputs da Infraestrutura
      # -----------------------------------------------------------
      - name: Configurar AWS e Ler Infra
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform (Apenas para ler outputs)
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Carregar Variáveis da Infra
        id: infra
        working-directory: ./terraform
        run: |
          terraform init
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_frontend_bucket)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------
      # Deploy BACKEND
      # -----------------------------------------------------------
      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install & Test Backend
        working-directory: ./backend
        run: |
          npm ci
          # npm run lint (se tiver)
          # npm test (se tiver)

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Docker (Backend)
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy ECS (Backend)
        run: |
          aws ecs update-service --cluster ${{ steps.infra.outputs.ecs_cluster }} \
                                 --service ${{ steps.infra.outputs.ecs_service }} \
                                 --force-new-deployment

      # -----------------------------------------------------------
      # Deploy FRONTEND
      # -----------------------------------------------------------
      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Upload Frontend para S3
        run: |
          aws s3 sync ./frontend/dist s3://${{ steps.infra.outputs.s3_bucket }} --delete